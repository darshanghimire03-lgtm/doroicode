<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin - NPLcode</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0F0D">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div data-include="header" data-max="1100px" data-compact data-back></div>

<main>
  <nav class="tabs" id="tabs" aria-label="Admin sections">
    <button class="tab active" type="button" data-tab="matches">Matches <small id="cMatches">0</small></button>
    <button class="tab" type="button" data-tab="teams">Teams <small id="cTeams">0</small></button>
  </nav>

  <section id="matchesPane">
    <div class="toolbar">
      <input class="search" id="matchSearch" type="search" placeholder="Search matches" autocomplete="off">
      <button class="btn primary" type="button" id="addMatch">+ Add match</button>
    </div>
    <div class="list" id="matchList"><div class="empty">Loading...</div></div>
  </section>

  <section id="teamsPane" hidden>
    <div class="toolbar">
      <input class="search" id="teamSearch" type="search" placeholder="Search teams" autocomplete="off">
      <button class="btn primary" type="button" id="addTeam">+ Add team</button>
    </div>
    <div class="list" id="teamList"><div class="empty">Loading...</div></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/js/admin.js"></script>
</body>
</html>
